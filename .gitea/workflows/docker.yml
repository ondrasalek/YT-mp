name: Build & push Docker image

# Sestaví Docker image a pushne ho do Gitea container registry na git.slks.cz.
# Spouští se při tagu verze (vX.Y.Z) nebo ručně (workflow_dispatch).
#
# Používá čisté `docker` CLI (žádné buildx/marketplace akce) kvůli maximální
# kompatibilitě se self-hosted runnerem.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: git.slks.cz
  IMAGE_NAME: yt-mp

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostika prostředí
        run: |
          echo "ref=${{ github.ref }} (type=${{ github.ref_type }}, name=${{ github.ref_name }})"
          docker version
          docker info | grep -iE 'server version|storage driver' || true

      - name: Odvození tagů
        id: vars
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="manual-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bude se stavět: ${IMAGE}:${VERSION} a ${IMAGE}:latest"

      - name: Přihlášení do registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}" \
            -t "${{ steps.vars.outputs.image }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}"
          docker push "${{ steps.vars.outputs.image }}:latest"
