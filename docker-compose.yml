# ============================================================================
# SAMOSTATNÝ SERVER (dedikovaný VPS, kde před aplikací nic nestojí)
#
# Obsahuje vlastní Caddy reverzní proxy s automatickým HTTPS.
# Build proběhne lokálně -> funguje na libovolné architektuře serveru.
#
#   docker compose up -d --build
#   # s reálnou doménou:
#   DOMAIN=ytmp.example.com ACME_EMAIL=ty@example.com docker compose up -d --build
#
# Pro Coolify / prostředí s vlastní proxy použij místo tohoto:
#   docker compose -f docker-compose.coolify.yml up -d
# ============================================================================

services:
  ytmp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ytmp:0.3.4
    container_name: ytmp
    # Port se nepublikuje na hostitele — přístup jde přes Caddy (TLS).
    expose:
      - "8080"
    volumes:
      # Dočasné per-job soubory + cookies.txt (přežijí restart/redeploy).
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Token pro POST /admin/cookies (nahrání/refresh cookies přes HTTP,
      # bez SSH a bez restartu kontejneru). Prázdné = endpoint je vypnutý.
      # Vygeneruj náhodný řetězec, např.: openssl rand -hex 32
      - YTMP_ADMIN_TOKEN=${YTMP_ADMIN_TOKEN:-}
    # Produkční limity — uprav dle výkonu serveru.
    command:
      - ytmp
      - serve
      - --host=0.0.0.0
      - --port=8080
      - --python=python3
      - --data-dir=/app/data
      - --max-concurrent=3
      - --max-queue=20
      - --rate-limit=10
      - --max-duration=10800   # 3 h; 0 = bez limitu
      # Cesta k cookies — nemusí při startu existovat, lze ji kdykoliv
      # nahrát/aktualizovat za běhu (viz YTMP_ADMIN_TOKEN výše):
      #   curl -X POST https://tva-domena/admin/cookies \
      #        -H "Authorization: Bearer $YTMP_ADMIN_TOKEN" \
      #        --data-binary @cookies.txt
      - --cookies=/app/data/cookies.txt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: ytmp-caddy
    depends_on:
      - ytmp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Pro produkci nastav reálnou doménu a e-mail (ACME/Let's Encrypt).
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
