[package]
name = "ytmp"
version = "0.3.2"
edition = "2021"
description = "YouTube -> MP3/MP4 konvertor: Rust orchestrační jádro nad Python yt-dlp workerem."
license = "MIT"

[[bin]]
name = "ytmp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "net", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
thiserror = "1"
axum = "0.8"
async-stream = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[profile.release]
lto = true
opt-level = 3
